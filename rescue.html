<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>استرجاع البيانات</title>
<style>
  body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#f4f5f7;color:#15202b;margin:0;padding:16px;line-height:1.7}
  .box{max-width:560px;margin:24px auto;background:#fff;border:1px solid #d6dbe1;border-radius:14px;padding:22px}
  h1{font-size:22px;margin:0 0 12px}
  .n{font-size:17px;margin:6px 0}
  .n b{font-size:22px}
  button,a.btn{display:block;width:100%;box-sizing:border-box;text-align:center;font:inherit;font-size:18px;font-weight:700;padding:14px;border-radius:10px;border:0;margin-top:14px;cursor:pointer;text-decoration:none}
  #b1{background:#0b4f57;color:#fff}
  #b2{background:#1d6f3a;color:#fff}
  [hidden]{display:none!important}
  [disabled]{opacity:.45;cursor:not-allowed}
  .msg{margin-top:14px;padding:12px;border-radius:10px;font-weight:600}
  .ok{background:#e3f4e8;color:#14532d}.bad{background:#fde8e8;color:#8a1c1c}
  .small{font-size:14px;color:#55606b}
</style>
</head>
<body>
<div class="box">
  <h1>استرجاع بيانات دنسو</h1>
  <div id="info"></div>
  <button id="b1" type="button">١ — تنزيل نسخة احتياطية وتجهيز الاسترجاع</button>
  <div id="m1"></div>
  <a id="b2" class="btn" href="./denso_v61.html" hidden>٢ — فتح دنسو لرفع البيانات</a>
  <p class="small">هذه الصفحة لا ترسل شيئاً إلى أي مكان. تقرأ النسخة المحفوظة في هذا المتصفح فقط.</p>
</div>
<script>
(function(){
  var SK='denso_v42';
  function J(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
  function ck(x){return (x&&x.id!=null&&x.id!=='')?'i'+String(x.id).replace(/[.#$\/\[\]]/g,'_'):null;}
  var db=J(SK,[])||[], sups=J('dn_s',[])||[], orders=J('dn_orders',[])||[], fut=J('dn_future',[])||[];
  var info=document.getElementById('info'), b1=document.getElementById('b1'), b2=document.getElementById('b2'), m1=document.getElementById('m1');
  info.innerHTML='<div class="n">القطع المحفوظة في هذا المتصفح: <b>'+db.length+'</b></div>'+
    '<div class="n">الموردون: <b>'+sups.length+'</b> — الطلبات: <b>'+orders.length+'</b></div>';
  if(!db.length){
    b1.disabled=true;
    m1.innerHTML='<div class="msg bad">لا توجد قطع محفوظة في هذا المتصفح. لا تفتح دنسو، وأخبر من أرسل لك هذه الصفحة.</div>';
    return;
  }
  b1.onclick=function(){
    try{
      // 1) a file copy of everything stored here (sign-in and API keys left out)
      var all={}; for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i); if(k==='dn_rt_p'||k==='dn_apikey'||k==='saved_email') continue; all[k]=localStorage.getItem(k);}
      var blob=new Blob([JSON.stringify({savedAt:new Date().toISOString(),data:all})],{type:'application/json'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download='denso-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove();
      // 2) a second copy inside the browser
      try{localStorage.setItem('dn_rescue_copy',JSON.stringify({t:Date.now(),db:db,sups:sups,orders:orders,fut:fut}));}catch(e){}
      // 3) mark every part, supplier and order as "changed here just now", so this copy wins and is uploaded
      var d=J('dn_cdirty56',{})||{}, now=Date.now();
      [['db',db],['sups',sups],['orders',orders]].forEach(function(p){
        var dc=d[p[0]]||{}; p[1].forEach(function(x){var k=ck(x); if(k) dc[k]=now;}); d[p[0]]=dc;
      });
      localStorage.setItem('dn_cdirty56',JSON.stringify(d));
      // check it was really written
      var chk=J('dn_cdirty56',{}), n=Object.keys((chk&&chk.db)||{}).length;
      if(n<db.length*0.99) throw new Error('not saved');
      m1.innerHTML='<div class="msg ok">تم. نزلت النسخة الاحتياطية وجُهّز استرجاع '+n+' قطعة. اضغط الزر الثاني الآن.</div>';
      b1.disabled=true; b2.hidden=false;
    }catch(e){
      m1.innerHTML='<div class="msg bad">تعذر التجهيز. لا تفتح دنسو، وأخبر من أرسل لك هذه الصفحة.</div>';
    }
  };
})();
</script>
</body>
</html>
